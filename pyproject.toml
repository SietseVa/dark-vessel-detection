[project]
name = "dark-vessel-detection"
version = "0.1.0"
description = "Detect dark vessels on Sentinel-1 radar tiles and compare them with AIS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "imagecodecs>=2026.10.10",
    "ipykernel>=7.4.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "tifffile>=2026.10.15",
    "ultralytics>=8.4.208",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dvd = "dark_vessel_detection.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
